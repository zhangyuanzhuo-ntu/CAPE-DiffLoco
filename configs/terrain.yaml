# Proposed experiment configuration; not historical measured parameters.
seed: 42
robot: Unitree_Go1
control_hz: 100
physics_dt: 0.002
decimation: 5
terrain:
  types: [gap, mixed, rough, unseen_stairs]
  gap_width_m: [0.08, 0.35]
  rough_height_m: [0.01, 0.12]
  stair_riser_m: [0.08, 0.20]
  stair_tread_m: [0.20, 0.35]
  mixed_weights: [0.25, 0.25, 0.25, 0.25]
randomization:
  friction: [0.35, 1.20]
  payload_kg: [0.0, 2.0]
  com_offset_m: [-0.025, 0.025]
  action_delay_steps: [0, 2]
training:
  seeds: [0, 1, 2]
  num_envs: 1024
  horizon: 24
  iterations: 20000
  learning_rate: 0.0003
  history_steps: 10
  prediction_steps: 5
  latent_dim: 16
