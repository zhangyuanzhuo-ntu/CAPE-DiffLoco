evaluation:
  num_trials_per_scenario: 100
  command_velocity_mps: [0.2, 0.4, 0.6]
  scenarios:
    - indoor_regular_stairs
    - irregular_stairs
    - metal_steps_low_damping
    - wet_brick_low_friction
    - muddy_grass_deformable
